<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Build Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — roster rail on the left, character sheet in the middle, gear drawer as its own tab. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --panel-2: #f5f7fb; --ink: #141a2b; --muted: #5d6680; --line: #d9deea;
  --accent: #a87b12; --accent-soft: #f6ecd2; --accent-ink: #ffffff;
  --good: #1f8a5b; --good-soft: #dcf3e8; --warn: #a86a00; --warn-soft: #fbefd5; --bad: #c0392b; --bad-soft: #fbe2df;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(20,26,43,.06), 0 4px 14px rgba(20,26,43,.05);
  --el-fire:#d9482f; --el-ice:#2f9fd0; --el-lightning:#8f5bcf; --el-wind:#1fa37f; --el-quantum:#5b52e0; --el-imaginary:#b58d10; --el-physical:#7b828c;
  --el-pyro:#d9482f; --el-hydro:#2d7fe0; --el-electro:#8f5bcf; --el-cryo:#2f9fd0; --el-anemo:#1fa37f; --el-geo:#b8860b; --el-dendro:#5a9a1f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1220; --panel: #141b2e; --panel-2: #1a2238; --ink: #e6e9f2; --muted: #98a1ba; --line: #283252;
  --accent: #e2b84a; --accent-soft: #3a3016; --accent-ink: #1a1405;
  --good: #4cc38a; --good-soft: #143326; --warn: #e6a93a; --warn-soft: #3a2c10; --bad: #f07466; --bad-soft: #3d1a17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --el-fire:#ff7a5c; --el-ice:#6cc8f0; --el-lightning:#b78cf0; --el-wind:#5fd6b1; --el-quantum:#8d86ff; --el-imaginary:#ecc94b; --el-physical:#b0b7c2;
  --el-pyro:#ff7a5c; --el-hydro:#5aa2ff; --el-electro:#b78cf0; --el-cryo:#6cc8f0; --el-anemo:#5fd6b1; --el-geo:#e2b13c; --el-dendro:#93cf55;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1220; --panel: #141b2e; --panel-2: #1a2238; --ink: #e6e9f2; --muted: #98a1ba; --line: #283252;
  --accent: #e2b84a; --accent-soft: #3a3016; --accent-ink: #1a1405;
  --good: #4cc38a; --good-soft: #143326; --warn: #e6a93a; --warn-soft: #3a2c10; --bad: #f07466; --bad-soft: #3d1a17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --el-fire:#ff7a5c; --el-ice:#6cc8f0; --el-lightning:#b78cf0; --el-wind:#5fd6b1; --el-quantum:#8d86ff; --el-imaginary:#ecc94b; --el-physical:#b0b7c2;
  --el-pyro:#ff7a5c; --el-hydro:#5aa2ff; --el-electro:#b78cf0; --el-cryo:#6cc8f0; --el-anemo:#5fd6b1; --el-geo:#e2b13c; --el-dendro:#93cf55;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { font: 700 1.5rem/1 var(--font-display); letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 500 .78rem var(--font-body); color: var(--muted); letter-spacing: 0; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.seg.small button { padding: 3px 10px; font-size: .85rem; }
.spacer { flex: 1; }
.sync { color: var(--muted); font-size: .8rem; }
.layout { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0,1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 14px 16px; }
h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
/* roster */
.roster { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
@media (max-width: 860px) { .roster { position: static; max-height: none; } }
.roster .filters { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.roster input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: .78rem; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.rlist { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; }
@media (max-width: 860px) { .rlist { max-height: 240px; } }
.ritem { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.ritem:hover { background: var(--panel-2); }
.ritem[aria-current="true"] { background: var(--accent-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.ritem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stars { font-size: .72rem; color: var(--accent); letter-spacing: -1px; }
.ritem .tag { font-size: .7rem; color: var(--muted); }
/* sheet */
.sheet { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px 18px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--elc, var(--accent)); }
.hero .name { font: 700 1.9rem/1.05 var(--font-display); letter-spacing: .01em; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: .78rem; background: var(--panel-2); white-space: nowrap; }
.pill.el { border-color: var(--elc); color: var(--elc); }
.hero .base { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px 14px; flex: 1; min-width: 240px; }
.kv { display: flex; flex-direction: column; }
.kv span:first-child { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kv span:last-child { font-family: var(--font-num); font-size: 1rem; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.box { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: var(--panel-2); min-width: 0; }
.box h3 { margin-bottom: 8px; }
.opt { padding: 7px 0; border-top: 1px dashed var(--line); }
.opt:first-of-type { border-top: 0; padding-top: 0; }
.opt .rank { font: 600 .72rem var(--font-num); color: var(--accent); margin-right: 6px; }
.opt .desc { font-size: .82rem; color: var(--muted); margin-top: 2px; }
.mainrow { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: .9rem; }
.mainrow b { font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
ol.prio { margin: 0; padding-left: 20px; }
ol.prio li { padding: 1px 0; }
.lclist { display: flex; flex-direction: column; gap: 6px; }
.lc { display: flex; gap: 10px; align-items: baseline; }
.lc .rr { font-size: .72rem; color: var(--accent); min-width: 34px; }
.note { font-size: .84rem; color: var(--muted); }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: .88rem; }
/* kit */
.skill { padding: 10px 0; border-top: 1px solid var(--line); }
.skill:first-child { border-top: 0; }
.skill .st { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.skill .sn { font-weight: 600; }
.skill p { margin: 4px 0 0; white-space: pre-line; max-width: 80ch; }
.lvl { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.lvl input { width: 120px; accent-color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }
/* gear */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.piece { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--panel); display: flex; flex-direction: column; gap: 3px; min-width: 0; position: relative; }
.piece .sl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.piece .set { font-weight: 600; font-size: .86rem; line-height: 1.25; }
.piece .main { font-family: var(--font-num); font-size: .92rem; }
.piece .subs { font-family: var(--font-num); font-size: .8rem; color: var(--muted); display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
.piece .subs .w { color: var(--ink); }
.piece.empty { border-style: dashed; color: var(--muted); justify-content: center; min-height: 120px; }
.grade { font: 700 .82rem var(--font-num); padding: 0 7px; border-radius: 6px; }
.g-S { background: var(--good-soft); color: var(--good); }
.g-A { background: var(--good-soft); color: var(--good); }
.g-B { background: var(--accent-soft); color: var(--accent); }
.g-C { background: var(--warn-soft); color: var(--warn); }
.g-D { background: var(--bad-soft); color: var(--bad); }
.flag { font-size: .74rem; color: var(--bad); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
.stat .l { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font: 500 1.05rem var(--font-num); }
.stat.ok { border-color: var(--good); } .stat.low { border-color: var(--warn); }
.stat .t { font-size: .72rem; color: var(--muted); }
.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.tips li::marker { color: var(--accent); }
.optrow { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: .88rem; }
.optrow:first-child { border-top: 0; }
.optrow.best { font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--accent); }
/* inventory */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .ritem:focus-visible, .tabs button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.f { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); min-width: 0; }
.f input, .f select, textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); font-size: .9rem; min-width: 0; width: 100%; }
.subrow { display: grid; grid-template-columns: minmax(0,1fr) 90px; gap: 6px; }
textarea { width: 100%; min-height: 110px; font-family: var(--font-num); font-size: .8rem; }
.invtable td { font-size: .82rem; }
.empty-state { text-align: center; padding: 30px 16px; color: var(--muted); }
.empty-state b { color: var(--ink); display: block; font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 4px; }
.err { color: var(--bad); font-size: .85rem; }
.okmsg { color: var(--good); font-size: .85rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .88rem; z-index: 20; }
.loading { padding: 60px 20px; text-align: center; color: var(--muted); font-family: var(--font-display); letter-spacing: .05em; }
details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
.wcalc .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 10px; }
.buffs { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .78rem; color: var(--muted); }
.buffs label { display: inline-flex; gap: 4px; align-items: center; }
.ask textarea { min-height: 60px; font-family: var(--font-body); font-size: .9rem; }
.answer { white-space: pre-wrap; font-size: .9rem; margin-top: 8px; max-width: 80ch; }
/* speed & turns */
.spdv { display: flex; flex-direction: column; gap: 16px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.mcard { position: relative; overflow: hidden; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.mcard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--elc, var(--line)); }
.mhead { display: flex; gap: 8px; align-items: center; }
.mhead select { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-weight: 600; }
.spdbig { font: 600 1.3rem var(--font-num); white-space: nowrap; color: var(--elc, var(--ink)); }
.form.tight { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mcard .f input:disabled, .mcard .f select:disabled { opacity: .5; }
.mcalc { line-height: 1.45; }
.rollbtns { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.rollbtns .btn { padding: 2px 8px; font-size: .78rem; font-family: var(--font-num); }
.effrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: .85rem; }
.effrow:first-child { border-top: 0; }
.effrow select, .effrow input:not([type=checkbox]), .spdv .toolbar select, .spdv .toolbar input:not([type=checkbox]) { padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); min-width: 0; max-width: 100%; }
.effrow input.n { width: 64px; }
.tl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 12px 4px 0; }
.tl { min-width: 640px; display: grid; grid-template-columns: 128px minmax(0, 1fr); row-gap: 6px; }
.tl-name { font-size: .85rem; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; padding-right: 10px; min-width: 0; }
.tl-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tl-name small { color: var(--muted); font-family: var(--font-num); font-size: .72rem; }
.tl-track { position: relative; height: 34px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); }
.tl-band { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
.tl-band.alt { background: var(--accent-soft); opacity: .55; }
.tl-axis { position: relative; height: 20px; font-size: .72rem; color: var(--muted); }
.tl-axis span { position: absolute; top: 2px; padding-left: 4px; white-space: nowrap; }
.mk { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--c); color: var(--panel); font: 600 .7rem/22px var(--font-num); text-align: center; box-shadow: 0 0 0 2px var(--panel); z-index: 1; }
.mk.x { background: var(--panel); color: var(--c); border: 2px dashed var(--c); line-height: 18px; }
.seqrow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: start; margin-bottom: 4px; }
.seqc { font: 600 .74rem var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px; }
.seq { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.seq li { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 5px; font-size: .78rem; background: var(--panel); }
.seq li i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.seq li .num { color: var(--muted); font-size: .72rem; }
.bpchips { display: flex; flex-wrap: wrap; gap: 4px; }
.bp { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font: .74rem var(--font-num); color: var(--muted); white-space: nowrap; }
.bp.hit { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.bp.next { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.spdv td:first-child { white-space: nowrap; }
.bptbl { min-width: 640px; }
.okc { color: var(--good); font-weight: 600; } .badc { color: var(--bad); font-weight: 600; }
.delta-up { color: var(--good); font-weight: 600; } .delta-down { color: var(--bad); font-weight: 600; }
@media (max-width: 520px) { .form.tight { grid-template-columns: minmax(0, 1fr); } .seqrow { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
/* team calculator */
.tm { display: flex; flex-direction: column; gap: 16px; }
.tmhead { display: flex; gap: 12px; justify-content: space-between; align-items: start; flex-wrap: wrap; margin-bottom: 6px; }
.tm select, .tm input[type=number] { padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); max-width: 100%; }
.tm input.n, .tm .mini-l input[type=number] { width: 68px; }
.tm select.mini { width: auto; margin-left: 4px; }
.tmsheet { min-width: 860px; table-layout: fixed; }
.tmsheet th:first-child { width: 150px; position: sticky; left: 0; background: var(--panel); z-index: 1; text-transform: none; letter-spacing: 0; font-size: .85rem; color: var(--ink); }
.tmsheet thead th { position: static; }
.tmsheet td { border-left: 1px solid var(--line); }
.tmsheet td select:not(.mini) { width: 100%; }

<script>
(() => {
"use strict";
/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const uid = () => Math.random().toString(36).slice(2, 10);
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ============ game constants ============ */
const PCT_HSR = new Set(["HP%","ATK%","DEF%","CRIT Rate","CRIT DMG","Effect Hit Rate","Effect RES","Break Effect","Energy Regeneration Rate","Outgoing Healing Boost","Physical DMG Boost","Fire DMG Boost","Ice DMG Boost","Lightning DMG Boost","Wind DMG Boost","Quantum DMG Boost","Imaginary DMG Boost","Elation","SPD%"]);
const PCT_GI = new Set(["HP%","ATK%","DEF%","Energy Recharge","CRIT Rate","CRIT DMG","Healing Bonus","Physical DMG Bonus","Pyro DMG Bonus","Hydro DMG Bonus","Electro DMG Bonus","Cryo DMG Bonus","Anemo DMG Bonus","Geo DMG Bonus","Dendro DMG Bonus"]);
const GAME = {
  hsr: { slots:["Head","Hands","Body","Feet","Planar Sphere","Link Rope"], relicSlots:["Head","Hands","Body","Feet"], planarSlots:["Planar Sphere","Link Rope"], maxLvl:15, pct:PCT_HSR,
         subStats:["HP","ATK","DEF","HP%","ATK%","DEF%","SPD","CRIT Rate","CRIT DMG","Effect Hit Rate","Effect RES","Break Effect"], fixedMain:{Head:"HP",Hands:"ATK"} },
  gi:  { slots:["Flower","Plume","Sands","Goblet","Circlet"], maxLvl:20, pct:PCT_GI,
         subStats:["HP","ATK","DEF","HP%","ATK%","DEF%","Elemental Mastery","Energy Recharge","CRIT Rate","CRIT DMG"], fixedMain:{Flower:"HP",Plume:"ATK"},
         mains:{ Sands:["HP%","ATK%","DEF%","Elemental Mastery","Energy Recharge"], Goblet:["HP%","ATK%","DEF%","Elemental Mastery","Pyro DMG Bonus","Hydro DMG Bonus","Electro DMG Bonus","Cryo DMG Bonus","Anemo DMG Bonus","Geo DMG Bonus","Dendro DMG Bonus","Physical DMG Bonus"], Circlet:["HP%","ATK%","DEF%","Elemental Mastery","CRIT Rate","CRIT DMG","Healing Bonus"] },
         main5:{ "HP":[717,4780],"ATK":[47,311],"HP%":[.07,.466],"ATK%":[.07,.466],"DEF%":[.087,.583],"Elemental Mastery":[28,186.5],"Energy Recharge":[.078,.518],"CRIT Rate":[.047,.311],"CRIT DMG":[.093,.622],"Healing Bonus":[.054,.359],"Physical DMG Bonus":[.087,.583],"ELEM":[.07,.466] },
         subMax:{ "HP":298.75,"ATK":19.45,"DEF":23.15,"HP%":.0583,"ATK%":.0583,"DEF%":.0729,"Elemental Mastery":23.31,"Energy Recharge":.0648,"CRIT Rate":.0389,"CRIT DMG":.0777 } }
};
const HSR_MAIN_OPTS = { Body:["HP%","ATK%","DEF%","CRIT Rate","CRIT DMG","Outgoing Healing Boost","Effect Hit Rate"], Feet:["HP%","ATK%","DEF%","SPD"],
  "Planar Sphere":["HP%","ATK%","DEF%","Physical DMG Boost","Fire DMG Boost","Ice DMG Boost","Lightning DMG Boost","Wind DMG Boost","Quantum DMG Boost","Imaginary DMG Boost"], "Link Rope":["HP%","ATK%","DEF%","Break Effect","Energy Regeneration Rate"] };
const EL_VAR = { Fire:"--el-fire", Ice:"--el-ice", Lightning:"--el-lightning", Wind:"--el-wind", Quantum:"--el-quantum", Imaginary:"--el-imaginary", Physical:"--el-physical",
  Pyro:"--el-pyro", Hydro:"--el-hydro", Electro:"--el-electro", Cryo:"--el-cryo", Anemo:"--el-anemo", Geo:"--el-geo", Dendro:"--el-dendro" };
const elColor = el => `var(${EL_VAR[el] || "--muted"})`;
const isPct = (g, s) => GAME[g].pct.has(s);
function fmtStat(g, s, v, d) { if (v == null || isNaN(v)) return "—"; if (isPct(g, s)) return (v*100).toFixed(d == null ? 1 : d) + "%"; if (s === "SPD") return v.toFixed(1); return Math.round(v).toLocaleString("en-US"); }
const short = s => ({"Energy Regeneration Rate":"Energy Regen","Outgoing Healing Boost":"Healing","Effect Hit Rate":"Effect Hit","Elemental Mastery":"EM","Energy Recharge":"ER"})[s] || s;

/* ============ state ============ */
const S = {
  game: LS.get("bl.game", "hsr"), view: "char", tab: LS.get("bl.tab", "build"),
  data: { hsr: null, gi: null }, sel: LS.get("bl.sel", { hsr: "1501", gi: "furina" }),
  filter: { q: "", el: "", r: "" }, inv: { hsr: [], gi: [] }, invLoaded: { hsr: false, gi: false },
  kitLvl: {}, wc: LS.get("bl.wc", {}), useOthers: true, editId: null, invFilter: { set: "", slot: "" },
  db: null, uidv: null, sample: null, cloudOk: {}, prefsLoaded: false
};

/* ============ data loading ============ */
async function loadGame(g) {
  if (S.data[g]) return S.data[g];
  const r = await fetch(g === "hsr" ? "hsr.json" : "genshin.json");
  if (!r.ok) throw new Error("Could not load " + g + " data (" + r.status + ")");
  const d = await r.json();
  prepare(g, d); S.data[g] = d; return d;
}
function prepare(g, d) {
  if (g === "hsr") {
    d.list = Object.entries(d.chars).map(([id, c]) => ({ id, ...c })).sort((a, b) => a.name.localeCompare(b.name));
    d.setNames = Object.keys(d.sets).sort();
    d.relicSetNames = d.setNames.filter(n => !d.sets[n].planar); d.planarSetNames = d.setNames.filter(n => d.sets[n].planar);
  } else {
    d.list = Object.entries(d.chars).map(([id, c]) => ({ id, ...c })).sort((a, b) => a.name.localeCompare(b.name));
    d.setByName = {}; for (const [k, s] of Object.entries(d.sets)) d.setByName[s.name] = k;
    d.setNames = Object.values(d.sets).filter(s => s.rar.includes(5) || s.rar.includes(4)).map(s => s.name).sort();
  }
}

/* ============ text rendering ============ */
function hsrText(desc, params) {
  return String(desc || "").replace(/#(\d+)\[(i|f\d)\](%?)/g, (m, n, f, pct) => {
    let v = params ? params[+n - 1] : undefined; if (v == null) return m;
    if (pct) v *= 100;
    const s = f === "i" ? String(Math.round(v * 100) / 100 % 1 === 0 ? Math.round(v) : +v.toFixed(2)) : v.toFixed(+f.slice(1));
    return s + pct;
  }).replace(/<[^>]+>/g, "").replace(/\\n/g, "\n");
}
function giLabel(label, P, lvl) {
  const [name, tpl] = label.split("|"); if (!tpl) return [name, ""];
  const val = tpl.replace(/\{(param\d+):([A-Z0-9]+)\}/g, (m, p, f) => {
    const arr = P[p]; if (!arr) return "?"; const v = arr[Math.min(lvl, arr.length) - 1];
    if (f.endsWith("P")) { const dd = f === "P" ? 0 : +f[1]; return (v * 100).toFixed(dd) + "%"; }
    if (f === "I") return String(Math.round(v)); const dd = +f.replace("F", ""); return isNaN(dd) ? String(v) : v.toFixed(dd);
  });
  return [name, val];
}

/* ============ stat model ============ */
function hsrMainVal(d, slot, stat, lvl) { const m = d.mains[slot] && d.mains[slot][stat]; return m ? m[0] + m[1] * lvl : 0; }
function giMainVal(stat, lvl) { const t = GAME.gi.main5[stat] || (/DMG Bonus$/.test(stat) && stat !== "Physical DMG Bonus" ? GAME.gi.main5.ELEM : null); if (!t) return 0; return t[0] + (t[1] - t[0]) * Math.min(lvl, 20) / 20; }
function mainVal(g, p) { return g === "hsr" ? hsrMainVal(S.data.hsr, p.slot, p.main, p.lvl) : giMainVal(p.main, p.lvl); }
function subMax(g, s) { return g === "hsr" ? S.data.hsr.subs[s] : GAME.gi.subMax[s]; }

// stat weights per character
function weightsFor(g, c, lcBase) {
  const w = {};
  if (g === "hsr") {
    Object.assign(w, c.weights || {});
    const base = { ATK: (c.base.ATK || 0) + (lcBase.ATK || 0), HP: (c.base.HP || 0) + (lcBase.HP || 0), DEF: (c.base.DEF || 0) + (lcBase.DEF || 0) };
    for (const f of ["ATK", "HP", "DEF"]) { const pw = w[f + "%"] || 0; if (base[f]) w[f] = Math.min(pw, w[f] == null ? pw : w[f]) * (S.data.hsr.subs[f] / (S.data.hsr.subs[f + "%"] * base[f])); }
  } else {
    const b = c.build || {}; const order = (b.subs || []).slice();
    const ladder = [1, 1, .75, .6, .45, .3];
    let i = 0; for (const s of order) { if ((s === "CRIT Rate" || s === "CRIT DMG") && order.includes("CRIT Rate") && order.includes("CRIT DMG")) w[s] = 1; else w[s] = ladder[Math.min(i, 5)]; i++; }
    if (w["CRIT Rate"] && !w["CRIT DMG"]) w["CRIT DMG"] = w["CRIT Rate"] * .8;
    const base = { ATK: c.base.attack + (lcBase.ATK || 0), HP: c.base.hp, DEF: c.base.defense };
    for (const f of ["ATK", "HP", "DEF"]) { const pw = w[f + "%"] || 0; w[f] = pw * (GAME.gi.subMax[f] / (GAME.gi.subMax[f + "%"] * base[f])); }
  }
  return w;
}
function pieceScore(g, p, w) { let s = 0; for (const x of p.subs || []) { const m = subMax(g, x.s); if (m) s += (w[x.s] || 0) * x.v / m; } return s; }
function grade(rolls) { return rolls >= 7 ? "S" : rolls >= 5.5 ? "A" : rolls >= 4 ? "B" : rolls >= 2.5 ? "C" : "D"; }
function mainOk(g, c, p) {
  if (GAME[g].fixedMain[p.slot]) return true;
  if (g === "hsr") { const l = (c.mains || {})[p.slot]; return !l || !l.length || l.includes(p.main); }
  const b = c.build || {}; const l = b[p.slot.toLowerCase()]; return !l || !l.length || l.includes(p.main);
}
function recMains(g, c, slot) { if (GAME[g].fixedMain[slot]) return [GAME[g].fixedMain[slot]]; if (g === "hsr") return (c.mains || {})[slot] || []; return ((c.build || {})[slot.toLowerCase()]) || []; }

// set 2pc parsing for totals
function parseSet2(g, setName) {
  const d = S.data[g];
  if (g === "hsr") {
    const s = d.sets[setName]; if (!s) return null; const t = s.d[0] || "";
    const m = t.match(/Increases (?:the wearer's )?(ATK|CRIT Rate|CRIT DMG|SPD|Max HP|DEF|Break Effect|Effect Hit Rate|Effect RES|Energy Regeneration Rate|Outgoing Healing|Elation|(?:Physical|Fire|Ice|Lightning|Wind|Quantum|Imaginary) DMG) by ([\d.]+)%/);
    if (!m) return null; let k = m[1]; k = k === "ATK" ? "ATK%" : k === "Max HP" ? "HP%" : k === "DEF" ? "DEF%" : k === "SPD" ? "SPD%" : k === "Outgoing Healing" ? "Outgoing Healing Boost" : /DMG$/.test(k) && k !== "CRIT DMG" ? k + " Boost" : k;
    return { [k]: +m[2] / 100 };
  }
  const key = d.setByName[setName]; const s = key && d.sets[key]; if (!s || !s.e2) return null;
  const m = s.e2.match(/^(?:Increases )?(ATK|HP|DEF|Energy Recharge|CRIT Rate|Elemental Mastery|Healing Bonus|(?:Pyro|Hydro|Electro|Cryo|Anemo|Geo|Dendro|Physical) DMG Bonus)\s*(?:\+|by\s*)([\d.]+)(%?)/i);
  if (!m) return null; let k = m[1]; if (k === "ATK" || k === "HP" || k === "DEF") k += "%";
  return { [k]: m[3] ? +m[2] / 100 : +m[2] };
}

/* ============ totals ============ */
function totals(g, c, pieces, gearExtra) {
  const add = {}; const A = (k, v) => add[k] = (add[k] || 0) + v;
  for (const p of pieces) { if (!p) continue; A(p.main, mainVal(g, p)); for (const x of p.subs || []) A(x.s, x.v); }
  const counts = {}; for (const p of pieces) if (p) counts[p.set] = (counts[p.set] || 0) + 1;
  const setNotes = [];
  for (const [n, k] of Object.entries(counts)) {
    const planar = g === "hsr" && S.data.hsr.sets[n] && S.data.hsr.sets[n].planar;
    if (k >= 2) { const b = parseSet2(g, n); if (b) for (const [s, v] of Object.entries(b)) A(s, v); setNotes.push((planar ? "2" : k >= 4 ? "4" : "2") + "pc " + n); }
  }
  if (gearExtra) for (const [s, v] of Object.entries(gearExtra)) A(s, v);
  const T = {};
  if (g === "hsr") {
    const lcb = gearExtra && gearExtra.__lc || {};
    const bA = c.base.ATK + (lcb.ATK || 0), bH = c.base.HP + (lcb.HP || 0), bD = c.base.DEF + (lcb.DEF || 0);
    const tr = c.traces || {}; const TR = k => tr[k] || 0;
    T.HP = bH * (1 + (add["HP%"] || 0) + TR("HP%")) + (add.HP || 0);
    T.ATK = bA * (1 + (add["ATK%"] || 0) + TR("ATK%")) + (add.ATK || 0);
    T.DEF = bD * (1 + (add["DEF%"] || 0) + TR("DEF%")) + (add.DEF || 0);
    T.SPD = c.base.SPD * (1 + (add["SPD%"] || 0)) + (add.SPD || 0) + TR("SPD");
    T["CRIT Rate"] = (c.base["CRIT Rate"] || .05) + (add["CRIT Rate"] || 0) + TR("CRIT Rate");
    T["CRIT DMG"] = (c.base["CRIT DMG"] || .5) + (add["CRIT DMG"] || 0) + TR("CRIT DMG");
    for (const k of ["Effect Hit Rate", "Effect RES", "Break Effect", "Energy Regeneration Rate", "Outgoing Healing Boost", "Elation"]) T[k] = (add[k] || 0) + TR(k);
    const elk = c.el + " DMG Boost"; T[elk] = (add[elk] || 0) + TR(elk);
    T._dmgKey = elk; T._base = { ATK: bA, HP: bH, DEF: bD };
  } else {
    const wb = gearExtra && gearExtra.__wpn || { atk: 0 };
    const asc = c.asc, ascv = c.ascv;
    const X = k => (add[k] || 0) + (asc === k ? ascv : 0) + (wb.sub === k ? wb.subv : 0);
    T.HP = c.base.hp * (1 + X("HP%")) + (add.HP || 0);
    T.ATK = (c.base.attack + wb.atk) * (1 + X("ATK%")) + (add.ATK || 0);
    T.DEF = c.base.defense * (1 + X("DEF%")) + (add.DEF || 0);
    T["Elemental Mastery"] = X("Elemental Mastery");
    T["Energy Recharge"] = 1 + X("Energy Recharge");
    T["CRIT Rate"] = (c.cr || .05) + X("CRIT Rate");
    T["CRIT DMG"] = (c.cd || .5) + X("CRIT DMG");
    T["Healing Bonus"] = X("Healing Bonus");
    const elk = c.el + " DMG Bonus"; T[elk] = X(elk); T._dmgKey = elk;
    T._base = { ATK: c.base.attack + wb.atk, HP: c.base.hp, DEF: c.base.defense };
  }
  T._sets = setNotes; return T;
}

/* ============ optimizer ============ */
function setOptions(g, c) {
  if (g === "hsr") {
    const rel = (c.relics || []).map(p => ({ kind: "relic", sets: p, label: p[0] === p[1] ? "4pc " + p[0] : "2pc " + p[0] + " + 2pc " + p[1] }));
    const relAlt = (c.relicsAlt || []).map(p => ({ kind: "relic", sets: p, alt: true, label: p[0] === p[1] ? "4pc " + p[0] : "2pc " + p[0] + " + 2pc " + p[1] }));
    const orn = (c.ornaments || []).map(n => ({ kind: "orn", set: n, label: n }));
    const ornAlt = (c.ornamentsAlt || []).filter((n, i, a) => a.indexOf(n) === i).map(n => ({ kind: "orn", set: n, alt: true, label: n }));
    return { rel: rel.concat(relAlt), orn: orn.concat(ornAlt) };
  }
  const d = S.data.gi; const b = c.build || {};
  return { gi: (b.sets || []).map(opt => ({ parts: opt.map(([k, n]) => ({ name: d.sets[k] ? d.sets[k].name : k, n })), label: opt.map(([k, n]) => n + "pc " + (d.sets[k] ? d.sets[k].name : k)).join(" + ") })) };
}
function optimize(g, c, inv, w) {
  const slots = GAME[g].slots;
  const pool = {}; for (const s of slots) pool[s] = [];
  for (const p of inv) { if (!pool[p.slot]) continue; const sc = pieceScore(g, p, w); const ok = mainOk(g, c, p); pool[p.slot].push({ p, sc, ok, val: sc + (ok ? 0 : -6) }); }
  for (const s of slots) pool[s].sort((a, b) => b.val - a.val);
  const bestOf = (slot, set) => { const l = pool[slot]; for (const x of l) if (!set || x.p.set === set) return x; return null; };
  const sum = arr => arr.reduce((a, x) => a + (x ? x.val : 0), 0);
  const free = {}; for (const s of slots) free[s] = bestOf(s);
  const results = [];
  if (g === "hsr") {
    const rs = GAME.hsr.relicSlots, ps = GAME.hsr.planarSlots;
    const { rel, orn } = setOptions(g, c);
    const relRes = rel.map(o => {
      const [A, B] = o.sets; let best = null;
      if (A === B) { const pick = rs.map(s => bestOf(s, A)); if (pick.every(Boolean)) best = { pick, score: sum(pick) }; else best = { pick, score: sum(pick), missing: rs.filter((s, i) => !pick[i]) }; }
      else { for (let m = 0; m < 16; m++) { if ([0,1,2,3].filter(i => m >> i & 1).length !== 2) continue; const pick = rs.map((s, i) => bestOf(s, m >> i & 1 ? A : B)); if (!pick.every(Boolean)) continue; const sc = sum(pick); if (!best || sc > best.score) best = { pick, score: sc }; } if (!best) best = { pick: rs.map(() => null), score: 0, missing: rs }; }
      return { ...o, ...best };
    });
    const ornRes = orn.map(o => { const pick = ps.map(s => bestOf(s, o.set)); return { ...o, pick, score: sum(pick), missing: pick.every(Boolean) ? null : ps.filter((s, i) => !pick[i]) }; });
    const freeRel = { label: "Best stats, any sets", pick: rs.map(s => free[s]), score: sum(rs.map(s => free[s])), free: true };
    const freeOrn = { label: "Best stats, any set", pick: ps.map(s => free[s]), score: sum(ps.map(s => free[s])), free: true };
    // choose: first recommended (non-alt) complete option within 2.5 rolls of the best complete option, else best complete
    const pickBest = (arr, fr) => { const full = arr.filter(o => !o.missing); if (!full.length) return fr; const top = Math.max(...full.map(o => o.score)); return full.find(o => !o.alt && o.score >= top - 2.5) || full.find(o => o.score === top); };
    const R = pickBest(relRes, freeRel), O = pickBest(ornRes, freeOrn);
    const chosen = {}; rs.forEach((s, i) => chosen[s] = R.pick[i]); ps.forEach((s, i) => chosen[s] = O.pick[i]);
    return { chosen, relRes, ornRes, freeRel, freeOrn, R, O, pool };
  }
  const opts = setOptions(g, c).gi;
  for (const o of opts) {
    let best = null;
    const p4 = o.parts.find(x => x.n === 4), p2 = o.parts.filter(x => x.n === 2);

/* ============ importers ============ */
const HSR_KEY = { "HP": "HP", "ATK": "ATK", "DEF": "DEF", "HP_": "HP%", "ATK_": "ATK%", "DEF_": "DEF%", "HP%": "HP%", "ATK%": "ATK%", "DEF%": "DEF%", "SPD": "SPD", "SPD_": "SPD", "CRIT Rate": "CRIT Rate", "CRIT Rate_": "CRIT Rate", "CRIT DMG": "CRIT DMG", "CRIT DMG_": "CRIT DMG",
  "Effect Hit Rate": "Effect Hit Rate", "Effect Hit Rate_": "Effect Hit Rate", "Effect RES": "Effect RES", "Effect RES_": "Effect RES", "Break Effect": "Break Effect", "Break Effect_": "Break Effect", "Energy Regeneration Rate": "Energy Regeneration Rate", "Energy Regeneration Rate_": "Energy Regeneration Rate",
  "Outgoing Healing Boost": "Outgoing Healing Boost", "Outgoing Healing Boost_": "Outgoing Healing Boost" };
function hsrStat(k) { if (!k) return null; if (HSR_KEY[k]) return HSR_KEY[k]; const m = String(k).match(/^(Physical|Fire|Ice|Lightning|Wind|Quantum|Imaginary) DMG( Boost)?_?$/); if (m) return m[1] + " DMG Boost"; return null; }
const HSR_SLOT = { head: "Head", hands: "Hands", body: "Body", feet: "Feet", planarsphere: "Planar Sphere", sphere: "Planar Sphere", linkrope: "Link Rope", rope: "Link Rope" };
function importHsr(j) {
  const d = S.data.hsr; const arr = Array.isArray(j) ? j : (j.relics || j.Relics || []); const out = []; let skipped = 0;
  const setByNorm = {}; for (const n of d.setNames) setByNorm[norm(n)] = n;
  const setById = {}; for (const [n, s] of Object.entries(d.sets)) setById[String(s.id)] = n;
  for (const r of arr) {
    try {
      const set = setByNorm[norm(r.set || r.setName || r.name || "")] || setById[String(r.set_id || r.setId || "")];
      const slot = HSR_SLOT[norm(r.slot || r.part || "")];
      const lvl = +(r.level ?? r.enhance ?? 0);
      const rarity = +(r.rarity ?? r.grade ?? 5); if (rarity && rarity < 5) { skipped++; continue; }
      const mk = r.mainstat || (r.main && r.main.stat) || r.mainStat; const main = hsrStat(mk) || (slot === "Head" ? "HP" : slot === "Hands" ? "ATK" : null);
      if (!set || !slot || !main) { skipped++; continue; }
      const subsIn = r.substats || r.subs || [];
      const subs = subsIn.map(x => { const s = hsrStat(x.key || x.stat); if (!s) return null; let v = +x.value; if (PCT_HSR.has(s) && v > 1) v /= 100; return { s, v }; }).filter(Boolean);
      out.push({ id: uid(), set, slot, lvl: Math.min(15, lvl), main, subs, loc: r.location || r.equippedBy || "", ex: false });
    } catch (e) { skipped++; }
  }
  return { pieces: out, skipped };
}
const GI_KEY = { hp: "HP", hp_: "HP%", atk: "ATK", atk_: "ATK%", def: "DEF", def_: "DEF%", eleMas: "Elemental Mastery", enerRech_: "Energy Recharge", critRate_: "CRIT Rate", critDMG_: "CRIT DMG", heal_: "Healing Bonus",
  physical_dmg_: "Physical DMG Bonus", pyro_dmg_: "Pyro DMG Bonus", hydro_dmg_: "Hydro DMG Bonus", electro_dmg_: "Electro DMG Bonus", cryo_dmg_: "Cryo DMG Bonus", anemo_dmg_: "Anemo DMG Bonus", geo_dmg_: "Geo DMG Bonus", dendro_dmg_: "Dendro DMG Bonus" };
const GI_SLOT = { flower: "Flower", plume: "Plume", sands: "Sands", goblet: "Goblet", circlet: "Circlet" };
function importGi(j) {
  const d = S.data.gi; const arr = Array.isArray(j) ? j : (j.artifacts || []); const out = []; let skipped = 0;
  const setByNorm = {}; for (const s of Object.values(d.sets)) setByNorm[norm(s.name)] = s.name;
  for (const a of arr) {
    const set = setByNorm[norm(a.setKey || a.set || "")]; const slot = GI_SLOT[a.slotKey || a.slot]; const main = GI_KEY[a.mainStatKey] || a.mainStat;
    if (!set || !slot || !main || (a.rarity && a.rarity < 5)) { skipped++; continue; }
    const subs = (a.substats || []).filter(x => x.key && GI_KEY[x.key] && x.value).map(x => { const s = GI_KEY[x.key]; return { s, v: PCT_GI.has(s) ? +x.value / 100 : +x.value }; });
    out.push({ id: uid(), set, slot, lvl: Math.min(20, +a.level || 0), main, subs, loc: a.location || "", ex: false });
  }
  return { pieces: out, skipped };
}

/* ============ example gear ============ */
function makeExamples(g) {
  const d = S.data[g]; const c = curChar(); let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const out = []; const slots = GAME[g].slots;
  let sets;
  if (g === "hsr") { const rs = (c.relics || [])[0] || [d.relicSetNames[0], d.relicSetNames[0]]; const os = (c.ornaments || [])[0] || d.planarSetNames[0]; sets = { r: [rs[0], rs[1], pick(d.relicSetNames)], p: [os, pick(d.planarSetNames)] }; }
  else { const b = c.build; const first = b ? d.sets[b.sets[0][0][0]].name : d.setNames[0]; sets = { r: [first, first, pick(d.setNames)] }; }
  for (let n = 0; n < 3; n++) for (const slot of slots) {
    const planar = g === "hsr" && GAME.hsr.planarSlots.includes(slot);
    const set = planar ? sets.p[n % 2] : sets.r[n % 3];
    const opts = GAME[g].fixedMain[slot] ? [GAME[g].fixedMain[slot]] : g === "hsr" ? HSR_MAIN_OPTS[slot] : GAME.gi.mains[slot];
    const rec = recMains(g, c, slot); const main = rnd() < .7 && rec.length ? pick(rec) : pick(opts);
    const pool = GAME[g].subStats.filter(s => s !== main); const subs = [];
    while (subs.length < 4) { const s = pick(pool); if (!subs.some(x => x.s === s)) subs.push({ s, v: 0 }); }
    const rolls = 4 + 5; for (let i = 0; i < rolls; i++) { const x = i < 4 ? subs[i] : pick(subs); x.v += subMax(g, x.s) * (0.8 + 0.2 * Math.floor(rnd() * 3) / 2); }
    out.push({ id: uid(), set, slot, lvl: GAME[g].maxLvl, main, subs, loc: "", ex: true });
  }
  return out;
}

    if (S.view !== "team") return; const g = S.game, t = tmState(g), el = e.target, d = el.dataset;
    if (d.f) { const sl = t.slots[+d.i];
      if (d.f === "id") { t.slots[+d.i] = { id: el.value }; }
      else if (d.f === "infuse") sl.infuse = el.checked; else if (d.f === "gear") { if (el.value) sl.gear = el.value; else delete sl.gear; }
      else if (d.f === "rank" || d.f === "cons" || d.f === "rolls") sl[d.f] = +el.value; else sl[d.f] = el.value;
      redo(); }
    else if (d.man) { const sl = t.slots[+d.i]; sl.man = sl.man || {}; if (el.value === "") delete sl.man[d.man]; else sl.man[d.man] = TM_MANP.has(d.man) ? +el.value / 100 : +el.value; redo(); }
    else if (d.t) { t[d.t] = el.type === "checkbox" ? el.checked : +el.value; redo(); }
    else if (d.b) { const o = t.buffs[d.id] = t.buffs[d.id] || {}; if (d.b === "on") o.on = el.checked; else if (d.b === "up") o.up = Math.min(1, Math.max(0, +el.value / 100)); else if (d.b === "tgt") o.tgt = +el.value; else if (d.b === "v") { if (d.id.startsWith("custom|")) t.custom[+d.id.slice(7)].v = d.flat === "1" ? +el.value : +el.value / 100; else o.v = d.flat === "1" ? +el.value : +el.value / 100; } redo(); }
    else if (d.rot) { const sl = t.slots[+d.i]; sl.rot = sl.rot || {}; sl.rot[d.rot] = Math.max(0, +el.value || 0); redo(); }
  });
}

/* ============ boot ============ */
$("gameSeg").addEventListener("click", async e => { const b = e.target.closest("[data-g]"); if (!b || b.dataset.g === S.game) return; S.game = b.dataset.g; S.editId = null; savePrefs(); render(); await ensureGame(S.game); render(); });
$("viewSeg").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; S.view = b.dataset.v; S.editId = null; render(); });
async function ensureGame(g) {
  try { await loadGame(g); await loadInv(g); }
  catch (e) { $("app").innerHTML = `<div class="card pad err">${esc(e.message)}. Reload the page to try again.</div>`; throw e; }
}
// capabilities light up later; the page renders from browser storage first
async function connect() {
  if (!(window.claude && window.claude.use)) { S.db = null; setSync("Saving in this browser"); return; }
  const samp = window.claude.use("sample").then(x => { S.sample = x || null; if (S.sample && S.view === "char" && S.data[S.game]) renderAsk(curChar()); }).catch(() => {});
  try {
    const [db, user] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("user").catch(() => null)]);
    const id = db && user ? await user.id().catch(() => null) : null;
    if (!db || !id) { S.db = null; setSync("Saving in this browser"); return; }
    S.db = db; S.uidv = id;
    try { const p = await db.doc("data/users/" + id + "/prefs").get(); if (p.exists) { const d = p.data() || {}; if (d.sel) { S.sel = d.sel; LS.set("bl.sel", S.sel); } if (d.wc) { S.wc = d.wc; LS.set("bl.wc", S.wc); } if (d.team && Object.keys(d.team).length) { S.team = d.team; LS.set("bl.team", S.team); } } S.prefsLoaded = true; } catch (e) {}
    // reload inventories from the account; push browser-only gear up if the account has none yet
    for (const g of ["hsr", "gi"]) {
      if (!S.data[g]) continue;
      const local = S.inv[g]; S.invLoaded[g] = false; await loadInv(g);
      if (!S.inv[g].length && local.length) { S.inv[g] = local; await saveInv(g); }
    }
    setSync("Synced to your account"); render();
  } catch (e) { S.db = null; setSync("Saving in this browser"); }
  await samp;
}
(async () => {
  const conn = connect();
  await ensureGame(S.game); render();
  ensureGame(S.game === "hsr" ? "gi" : "hsr").then(() => { if (S.db && S.uidv) { S.invLoaded[S.game === "hsr" ? "gi" : "hsr"] = false; return loadInv(S.game === "hsr" ? "gi" : "hsr"); } }).catch(() => {});
  await conn;
})();
})();
</script>
