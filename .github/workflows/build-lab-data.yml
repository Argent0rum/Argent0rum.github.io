# Build Lab: looks for newly released characters, weapons and gear sets once a week and saves them to
# tools/build-lab/data. Free to run, uses no Claude usage. Run it by hand: Actions → "Build Lab data" → Run workflow.
name: Build Lab data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build-lab/update.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-lab
          git diff --cached --quiet || (git commit -m "Build Lab: new game data" && git push)
